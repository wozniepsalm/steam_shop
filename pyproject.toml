[project]
name = "steam-shop"
version = "0.1.0"
description = "Chat for buying games inspired by Steam"
readme = "README.md"
authors = [
    { name = "Maja Woźniak", email = "mwozniak46@st.swps.edu.pl" }
]
requires-python = ">=3.13"
dependencies = [
    "lark>=1.3.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
steam-shop = "steam_shop.steam_shop:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "ipython>=9.18.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
